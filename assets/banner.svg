<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#101827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Stream Line Gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Dynamic CSS Animations */
    .pulse-line-1 {
      stroke: url(#streamGrad1);
      stroke-dasharray: 200 400;
      animation: flow1 8s linear infinite;
    }
    .pulse-line-2 {
      stroke: url(#streamGrad2);
      stroke-dasharray: 150 350;
      animation: flow2 6s linear infinite;
    }
    .node {
      animation: nodePulse 3s ease-in-out infinite alternate;
    }
    .node-2 {
      animation: nodePulse 3s ease-in-out 1.5s infinite alternate;
    }

    @keyframes flow1 {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: -1200; }
    }
    @keyframes flow2 {
      0% { stroke-dashoffset: -1000; }
      100% { stroke-dashoffset: 1000; }
    }
    @keyframes nodePulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.4); opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="1200" height="320" rx="16" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Animated Data Streams (Background layer, below text) -->
  <g filter="url(#glow)">
    <path class="pulse-line-1" d="M -50 260 Q 300 180 600 270 T 1250 200" fill="none" stroke-width="4" />
    <path class="pulse-line-2" d="M -50 80 Q 350 160 700 90 T 1250 140" fill="none" stroke-width="3" />
    <path class="pulse-line-1" d="M -50 180 Q 400 290 850 160 T 1250 280" fill="none" stroke-width="2" />
  </g>

  <!-- Dynamic Network Nodes (Side decorations) -->
  <g filter="url(#glow)">
    <circle cx="950" cy="90" r="6" fill="#38bdf8" class="node" />
    <circle cx="1050" cy="180" r="8" fill="#34d399" class="node-2" />
    <circle cx="880" cy="240" r="5" fill="#818cf8" class="node" />
    <circle cx="1120" cy="260" r="7" fill="#c084fc" class="node-2" />
    
    <line x1="950" y1="90" x2="1050" y2="180" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="1050" y1="180" x2="880" y2="240" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="1050" y1="180" x2="1120" y2="260" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Foreground Content Container (Text strictly above graphic elements) -->
  <g transform="translate(60, 0)">
    <!-- Badge Tag -->
    <rect x="0" y="52" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="110" y="70" text-anchor="middle" class="tag">CURATED ECOSYSTEM</text>

    <!-- Main Title with Shadow for maximum legibility -->
    <text x="0" y="145" class="title" filter="url(#shadow)">Awesome Real-Time Data Streaming</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle" filter="url(#shadow)">Event Streaming Platforms, Message Brokers, Stream Processing &amp; CDC</text>

    <!-- Pill Badges -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="70" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Event Streaming</text>

      <!-- Pill 2 -->
      <rect x="152" y="0" width="145" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="224.5" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#34d399">🔄 Stream Processing</text>

      <!-- Pill 3 -->
      <rect x="309" y="0" width="145" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="381.5" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc">🔀 Message Brokers</text>
    </g>
  </g>
</svg>
